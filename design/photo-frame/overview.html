<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mirror · frame overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #070605; color: #ccc; font-family: 'Helvetica Neue', Arial, sans-serif; }
        header { padding: 36px 40px 8px; display: flex; align-items: baseline; gap: 18px; }
        h1 { margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 34px; color: #fff; }
        header span { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #999; }
        .row { display: flex; gap: 28px; padding: 24px 40px 40px; }
        .phone { display: flex; flex-direction: column; gap: 12px; }
        iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; outline: 1px solid #2a2522; background: #000; }
        .phone span { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #999; text-align: center; }
    </style>
</head>
<body>
    <header><h1 id="title"></h1><span>390 × 844 · every aspect ratio</span></header>
    <div class="row" id="row"></div>
    <script>
        const NAMES = { edge: 'Edge Print', instant: 'Instant', placard: 'Placard', strip: 'Strip', postmark: 'Postmark' };
        const CASES = [
            ['ny-120', '120 film · square'],
            ['istanbul-digital', 'Digital · landscape'],
            ['ny-35-portrait', '35mm film · portrait'],
            ['ny-35-landscape', '35mm film · landscape'],
            ['istanbul-digital-portrait', 'Digital · portrait'],
        ];
        const option = new URLSearchParams(location.search).get('o') || 'edge';
        document.getElementById('title').textContent = NAMES[option];
        const row = document.getElementById('row');
        let pending = CASES.length;
        for (const [photo, label] of CASES) {
            const wrap = document.createElement('div');
            wrap.className = 'phone';
            const frame = document.createElement('iframe');
            frame.src = `index.html?o=${option}&p=${photo}`;
            frame.addEventListener('load', () => {
                const check = () => {
                    if (frame.contentDocument.body.dataset.ready === 'true') {
                        pending -= 1;
                        if (!pending) document.body.dataset.ready = 'true';
                    } else {
                        setTimeout(check, 50);
                    }
                };
                check();
            });
            const caption = document.createElement('span');
            caption.textContent = label;
            wrap.append(frame, caption);
            row.append(wrap);
        }
    </script>
</body>
</html>
