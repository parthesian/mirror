<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Admin</title>
    <link rel="icon" type="image/svg+xml" href="../mirror.svg">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="exposure-0 admin-page">
    <main class="admin-shell">
        <div class="admin-panel admin-panel-wide">
            <div class="admin-panel-header">
                <div>
                    <p class="admin-eyebrow">Cloudflare Access</p>
                    <h1>Gallery Admin</h1>
                </div>
                <a href="/" class="admin-back-link">Back to gallery</a>
            </div>

            <p id="admin-session-status" class="admin-session-status">Checking admin session...</p>

            <nav class="admin-tabs" aria-label="Admin tools">
                <button type="button" class="admin-tab active" data-admin-tab="metadata" aria-selected="true">photo metadata</button>
                <button type="button" class="admin-tab" data-admin-tab="upload" aria-selected="false">upload photo</button>
            </nav>

            <section id="metadata-section" class="admin-section" data-admin-section="metadata">
                <div class="admin-section-heading">
                    <div>
                        <p class="admin-eyebrow">Content management</p>
                        <h2>Photo Metadata</h2>
                    </div>
                    <label class="admin-search">
                        <span>search loaded photos</span>
                        <input id="metadata-search" type="search" placeholder="location, country, camera...">
                    </label>
                </div>

                <div class="admin-table-summary">
                    <span id="metadata-count">Loading photos...</span>
                    <span id="metadata-save-status" class="admin-save-status" role="status" aria-live="polite"></span>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-metadata-table">
                        <thead>
                            <tr>
                                <th scope="col">photo</th>
                                <th scope="col">date</th>
                                <th scope="col">location</th>
                                <th scope="col">country</th>
                                <th scope="col">state / region</th>
                                <th scope="col">camera / device</th>
                                <th scope="col">latitude</th>
                                <th scope="col">longitude</th>
                                <th scope="col">description</th>
                                <th scope="col"><span class="sr-only">actions</span></th>
                            </tr>
                        </thead>
                        <tbody id="metadata-table-body"></tbody>
                    </table>
                    <div id="metadata-empty" class="admin-empty-state hidden">No photos found.</div>
                </div>

                <div class="admin-table-actions">
                    <button type="button" id="load-more-metadata" class="btn hidden">load more</button>
                </div>
            </section>

            <section id="upload-section" class="admin-section hidden" data-admin-section="upload">
                <div class="admin-section-heading admin-upload-heading">
                    <div>
                        <p class="admin-eyebrow">Add to gallery</p>
                        <h2>Upload Photo</h2>
                    </div>
                </div>

                <form id="upload-form" class="upload-form admin-upload-form">
                <div class="form-group">
                    <label for="photo-file">photo</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="photo-file" accept="image/*" required>
                        <div class="file-input-box">
                            <span class="file-status-icon" id="file-status-icon">✕</span>
                        </div>
                    </div>
                    <div id="file-preview" class="file-preview">
                        <div class="preview-placeholder">
                            <img id="preview-image" src="" alt="Preview">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="photo-timestamp">date</label>
                    <input type="date" id="photo-timestamp">
                </div>

                <div class="form-group">
                    <label for="photo-location">location</label>
                    <input type="text" id="photo-location" required>
                </div>

                <div class="form-group">
                    <label for="photo-country">country</label>
                    <input type="text" id="photo-country" placeholder="e.g. Japan, USA, France">
                </div>

                <div class="form-group">
                    <label for="photo-state">state / region</label>
                    <input type="text" id="photo-state" placeholder="e.g. Wyoming, Hawai'i">
                </div>

                <div class="form-group">
                    <label for="photo-camera">camera / device</label>
                    <input type="text" id="photo-camera" placeholder="e.g. Canon EOS R5, iPhone 15 Pro">
                </div>

                <div class="form-group form-group-row">
                    <div class="form-group-half">
                        <label for="photo-latitude">latitude</label>
                        <input type="number" id="photo-latitude" step="any" min="-90" max="90" placeholder="e.g. 35.6762">
                    </div>
                    <div class="form-group-half">
                        <label for="photo-longitude">longitude</label>
                        <input type="number" id="photo-longitude" step="any" min="-180" max="180" placeholder="e.g. 139.6503">
                    </div>
                </div>

                <div class="form-group">
                    <label for="photo-description">description</label>
                    <textarea id="photo-description" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-upload" class="btn btn-primary">upload</button>
                </div>

                <div id="upload-progress" class="upload-progress">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <div id="upload-error" class="upload-error hidden">
                    <p></p>
                </div>

                <div id="upload-success" class="upload-success hidden">
                    <p></p>
                </div>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/config.js?v=20260717a"></script>
    <script src="../js/imageService.js?v=20260717a"></script>
    <script src="../js/customCalendar.js?v=20260717a"></script>
    <script src="../js/adminUpload.js?v=20260717a"></script>
</body>
</html>
